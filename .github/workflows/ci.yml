name: CI

# push(main) と PR で typecheck・build・test を回す。
# Seamlint は runtime 依存なしの単一 package なので、npm ci → typecheck → build → node --test だけで足りる。
on:
  push:
    branches: [main]
  pull_request:

# 同一 ref の古い実行はキャンセルして無駄なランを残さない。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # CLI テストは slnt.ts を子プロセスで起動し、相対パス・cwd・パス区切りを跨いで出力を検証する
    # （test/cli.test.ts、test/edges-command.test.ts）。この経路は OS 依存なので、ubuntu だけでは
    # Windows での破綻に気づけない。両 OS を matrix で回して実際に確かめる。
    runs-on: ${{ matrix.os }}
    strategy:
      # 片方が落ちても、もう片方の結果を捨てない（OS 固有の失敗かどうかを切り分けるため）。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      # lint は OS 非依存なので ubuntu の 1 本だけで足りる（二重実行しない）。
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # `npm test` は pretest で typecheck+build を再実行するため、ここでは test runner を直接叩く。
      - name: Test
        run: node --test

      # 利用者が受け取るのはリポジトリではなく npm の tarball。npm pack で作った tarball を
      # リポジトリ外の空ディレクトリに入れ、入れた slnt で sample を測れるかを見る
      # （files の漏れ・bin/shebang の壊れ・dist 不在は、上の test では見つからない）。
      - name: Packed install smoke test
        shell: bash
        run: |
          tarball="$(npm pack --silent --pack-destination "$RUNNER_TEMP" | tail -n 1)"
          mkdir "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP/$tarball"
          npx --no-install slnt check "$GITHUB_WORKSPACE/examples/armhole-kink.svg" --path body-armhole
